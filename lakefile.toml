name = "JaxProof"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Soir"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# silence mathlib style linters that are not relevant to this project
# (`weak.` skips the option silently in modules that do not import mathlib)
weak.linter.style.header = false
weak.linter.style.show = false
weak.linter.flexible = false
weak.linter.defProp = false
weak.linter.unusedSimpArgs = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "Soir"

[[lean_lib]]
name = "Xla"

[[lean_lib]]
name = "Random"

[[lean_lib]]
name = "Examples"

[[lean_lib]]
name = "QMC"
